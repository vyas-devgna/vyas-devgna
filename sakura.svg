<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%" height="150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- Cherry blossom petal -->
    <g id="blossom">
      <circle cx="0" cy="-5" r="4" />
      <circle cx="4.8" cy="-1.5" r="4" />
      <circle cx="3" cy="4" r="4" />
      <circle cx="-3" cy="4" r="4" />
      <circle cx="-4.8" cy="-1.5" r="4" />
      <circle cx="0" cy="0" r="2.5" fill="#fce4ec" opacity="0.9"/>
    </g>
    <!-- Small petal -->
    <ellipse id="mini" rx="3" ry="5"/>
  </defs>
  <style>
    @keyframes f1{0%{transform:translateY(-30px) rotate(0);opacity:0}8%{opacity:.8}85%{opacity:.6}100%{transform:translateY(160px) rotate(200deg);opacity:0}}
    @keyframes f2{0%{transform:translateY(-20px) rotate(0);opacity:0}10%{opacity:.7}80%{opacity:.5}100%{transform:translateY(155px) rotate(-180deg);opacity:0}}
    @keyframes f3{0%{transform:translateY(-25px) rotate(0);opacity:0}6%{opacity:.75}88%{opacity:.55}100%{transform:translateY(165px) rotate(150deg);opacity:0}}
    @keyframes sw{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
    @keyframes sw2{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px)}}
    .d1{animation:f1 7s ease-in infinite,sw 3s ease-in-out infinite}
    .d2{animation:f2 9s ease-in infinite,sw2 3.5s ease-in-out infinite}
    .d3{animation:f3 6s ease-in infinite,sw 4s ease-in-out infinite}
    .d4{animation:f1 10s ease-in infinite,sw2 2.8s ease-in-out infinite}
    .d5{animation:f2 5.5s ease-in infinite,sw 3.2s ease-in-out infinite}
    .d6{animation:f3 8s ease-in infinite,sw2 3.8s ease-in-out infinite}
    .d7{animation:f1 7.5s ease-in infinite,sw 2.5s ease-in-out infinite}
    .d8{animation:f2 6.5s ease-in infinite,sw2 4.2s ease-in-out infinite}
    .d9{animation:f3 9.5s ease-in infinite,sw 3s ease-in-out infinite}
    .d10{animation:f1 8.5s ease-in infinite,sw2 3.6s ease-in-out infinite}
    .d11{animation:f2 11s ease-in infinite,sw 4.5s ease-in-out infinite}
    .d12{animation:f3 6.8s ease-in infinite,sw2 2.6s ease-in-out infinite}
    .pk1{fill:#f8bbd0}
    .pk2{fill:#f48fb1}
    .pk3{fill:#f06292}
    .pk4{fill:#ec407a}
    .pk5{fill:#e8b4b8}
  </style>
  <!-- Background gradient matching the header -->
  <rect width="1200" height="150" fill="url(#bg)"/>
  <!-- Falling blossoms -->
  <use href="#blossom" x="60" y="10" class="pk1 d1" transform="scale(0.7)"/>
  <use href="#blossom" x="150" y="5" class="pk5 d2" transform="scale(0.55)"/>
  <use href="#mini" x="250" y="12" class="pk2 d3"/>
  <use href="#blossom" x="340" y="8" class="pk3 d4" transform="scale(0.65)"/>
  <use href="#mini" x="440" y="3" class="pk5 d5"/>
  <use href="#blossom" x="530" y="15" class="pk1 d6" transform="scale(0.5)"/>
  <use href="#mini" x="620" y="6" class="pk4 d7"/>
  <use href="#blossom" x="720" y="10" class="pk2 d8" transform="scale(0.6)"/>
  <use href="#mini" x="810" y="4" class="pk5 d9"/>
  <use href="#blossom" x="900" y="12" class="pk3 d10" transform="scale(0.55)"/>
  <use href="#mini" x="1000" y="7" class="pk1 d11"/>
  <use href="#blossom" x="1100" y="9" class="pk4 d12" transform="scale(0.5)"/>
</svg>
