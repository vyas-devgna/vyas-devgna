<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="120">
  <defs>
    <g id="b">
      <circle cx="0" cy="-4" r="3.2"/>
      <circle cx="3.8" cy="-1.2" r="3.2"/>
      <circle cx="2.4" cy="3.2" r="3.2"/>
      <circle cx="-2.4" cy="3.2" r="3.2"/>
      <circle cx="-3.8" cy="-1.2" r="3.2"/>
      <circle cx="0" cy="0" r="2" fill="#fce4ec" opacity="0.85"/>
    </g>
    <ellipse id="p" rx="2.5" ry="4.5"/>
  </defs>
  <style>
    @keyframes f1{0%{transform:translateY(-20px) rotate(0);opacity:0}8%{opacity:.7}88%{opacity:.5}100%{transform:translateY(130px) rotate(220deg);opacity:0}}
    @keyframes f2{0%{transform:translateY(-15px) rotate(0);opacity:0}10%{opacity:.65}85%{opacity:.45}100%{transform:translateY(125px) rotate(-200deg);opacity:0}}
    @keyframes f3{0%{transform:translateY(-18px) rotate(0);opacity:0}6%{opacity:.7}90%{opacity:.5}100%{transform:translateY(135px) rotate(170deg);opacity:0}}
    @keyframes sw{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
    @keyframes sw2{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
    .a{animation:f1 7s ease-in infinite,sw 3s ease-in-out infinite}
    .b{animation:f2 9s ease-in infinite,sw2 3.5s ease-in-out infinite}
    .c{animation:f3 6s ease-in infinite,sw 4s ease-in-out infinite}
    .d{animation:f1 10s ease-in infinite,sw2 2.8s ease-in-out infinite}
    .e{animation:f2 5.5s ease-in infinite,sw 3.2s ease-in-out infinite}
    .f{animation:f3 8s ease-in infinite,sw2 3.8s ease-in-out infinite}
    .g{animation:f1 7.5s ease-in infinite,sw 2.5s ease-in-out infinite}
    .h{animation:f2 6.5s ease-in infinite,sw2 4.2s ease-in-out infinite}
    .i{animation:f3 9.5s ease-in infinite,sw 3s ease-in-out infinite}
    .j{animation:f1 8.5s ease-in infinite,sw2 3.6s ease-in-out infinite}
    .k{animation:f2 11s ease-in infinite,sw 4.5s ease-in-out infinite}
    .l{animation:f3 6.8s ease-in infinite,sw2 2.6s ease-in-out infinite}
    .c1{fill:#f8bbd0}.c2{fill:#f48fb1}.c3{fill:#e8b4b8}.c4{fill:#f06292}.c5{fill:#fce4ec}
  </style>
  <use href="#b" x="70" y="5" class="c1 a" transform="scale(0.65)"/>
  <use href="#p" x="160" y="3" class="c3 b"/>
  <use href="#b" x="270" y="8" class="c2 c" transform="scale(0.55)"/>
  <use href="#p" x="370" y="2" class="c5 d"/>
  <use href="#b" x="470" y="6" class="c4 e" transform="scale(0.6)"/>
  <use href="#p" x="560" y="10" class="c1 f"/>
  <use href="#b" x="660" y="4" class="c3 g" transform="scale(0.5)"/>
  <use href="#p" x="760" y="7" class="c2 h"/>
  <use href="#b" x="860" y="3" class="c5 i" transform="scale(0.55)"/>
  <use href="#p" x="960" y="9" class="c4 j"/>
  <use href="#b" x="1060" y="5" class="c1 k" transform="scale(0.6)"/>
  <use href="#p" x="1140" y="6" class="c3 l"/>
</svg>
