<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="200">
  <style>
    @keyframes fall1 { 0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(40px, 200px) rotate(360deg); opacity: 0; } }
    @keyframes fall2 { 0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(-30px, 200px) rotate(-360deg); opacity: 0; } }
    @keyframes fall3 { 0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(20px, 200px) rotate(180deg); opacity: 0; } }
    @keyframes sway1 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(15px); } }
    @keyframes sway2 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-12px); } }
    .p { fill: #e8b4b8; }
    .p2 { fill: #f0c4c8; }
    .p3 { fill: #d4a0a4; }
    .s1 { animation: fall1 6s ease-in infinite; }
    .s2 { animation: fall2 8s ease-in infinite; }
    .s3 { animation: fall3 7s ease-in infinite; }
    .s4 { animation: fall1 9s ease-in infinite; }
    .s5 { animation: fall2 5s ease-in infinite; }
    .s6 { animation: fall3 10s ease-in infinite; }
    .s7 { animation: fall1 7.5s ease-in infinite; }
    .s8 { animation: fall2 6.5s ease-in infinite; }
    .s9 { animation: fall3 8.5s ease-in infinite; }
    .s10 { animation: fall1 5.5s ease-in infinite; }
    .s11 { animation: fall2 9.5s ease-in infinite; }
    .s12 { animation: fall3 7s ease-in infinite; }
    .s13 { animation: fall1 8s ease-in infinite; }
    .s14 { animation: fall2 6s ease-in infinite; }
    .s15 { animation: fall3 11s ease-in infinite; }
    .sw1 { animation: sway1 3s ease-in-out infinite; }
    .sw2 { animation: sway2 4s ease-in-out infinite; }
  </style>
  <!-- Petal shape: 5-lobe cherry blossom approximation -->
  <defs>
    <g id="petal">
      <ellipse cx="0" cy="-4" rx="3.5" ry="5.5"/>
      <ellipse cx="-3.8" cy="-1" rx="3.5" ry="5.5" transform="rotate(72)"/>
      <ellipse cx="3.8" cy="-1" rx="3.5" ry="5.5" transform="rotate(-72)"/>
      <ellipse cx="-2.3" cy="3.5" rx="3.5" ry="5.5" transform="rotate(144)"/>
      <ellipse cx="2.3" cy="3.5" rx="3.5" ry="5.5" transform="rotate(-144)"/>
      <circle cx="0" cy="0" r="2" fill="#f5d0d3"/>
    </g>
  </defs>
  <g class="sw1"><use href="#petal" x="80" y="10" class="p s1" transform="scale(1.2)"/></g>
  <g class="sw2"><use href="#petal" x="180" y="5" class="p2 s2" transform="scale(0.9)"/></g>
  <g class="sw1"><use href="#petal" x="300" y="15" class="p s3" transform="scale(1.0)"/></g>
  <g class="sw2"><use href="#petal" x="420" y="8" class="p3 s4" transform="scale(1.1)"/></g>
  <g class="sw1"><use href="#petal" x="530" y="3" class="p s5" transform="scale(0.8)"/></g>
  <g class="sw2"><use href="#petal" x="650" y="12" class="p2 s6" transform="scale(1.0)"/></g>
  <g class="sw1"><use href="#petal" x="750" y="6" class="p s7" transform="scale(1.3)"/></g>
  <g class="sw2"><use href="#petal" x="870" y="10" class="p3 s8" transform="scale(0.9)"/></g>
  <g class="sw1"><use href="#petal" x="970" y="4" class="p2 s9" transform="scale(1.1)"/></g>
  <g class="sw2"><use href="#petal" x="1080" y="14" class="p s10" transform="scale(0.85)"/></g>
  <g class="sw1"><use href="#petal" x="140" y="8" class="p3 s11" transform="scale(0.95)"/></g>
  <g class="sw2"><use href="#petal" x="350" y="2" class="p s12" transform="scale(1.15)"/></g>
  <g class="sw1"><use href="#petal" x="580" y="18" class="p2 s13" transform="scale(0.75)"/></g>
  <g class="sw2"><use href="#petal" x="820" y="7" class="p s14" transform="scale(1.05)"/></g>
  <g class="sw1"><use href="#petal" x="1150" y="11" class="p3 s15" transform="scale(0.9)"/></g>
</svg>
